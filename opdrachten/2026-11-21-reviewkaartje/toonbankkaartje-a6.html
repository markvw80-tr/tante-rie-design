<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Tante Rie reviewkaartje A6 staand (met 3 mm afloop)</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=block" rel="stylesheet">
<style>
  /* Snijmaat A6 staand 105 x 148 mm, afloop 3 mm rondom: pagina 111 x 154 mm.
     Veilige zone: 6 mm binnen de snijlijn (9 mm vanaf de paginarand). */
  @page { size: 111mm 154mm; margin: 0; }
  :root {
    --cream: #faf8f2; --text: #2a2a1a; --brown-dark: #1c1c14;
    --brown: #6b4c30; --brown-light: #c8c4b8; --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 111mm; height: 154mm; }
  body {
    background: var(--cream);
    font-family: "DM Sans", sans-serif;
    color: var(--text);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .kaart {
    position: absolute; left: 9mm; top: 9mm; width: 93mm; height: 136mm;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .merk {
    font-weight: 600; font-size: 13pt; letter-spacing: .16em; text-transform: uppercase;
    color: var(--brown-dark);
    padding: 3mm 0 3.5mm; width: 100%; border-bottom: .35mm solid var(--brown-light);
  }
  h1 { font-weight: 600; font-size: 17pt; line-height: 1.2; color: var(--brown-dark); margin: 9mm 0 4mm; }
  p { text-wrap: balance; font-weight: 400; font-size: 11.5pt; line-height: 1.45; max-width: 80mm; }
  .qr {
    margin-top: auto; background: var(--white); border-radius: 3mm; padding: 4mm;
    width: 58mm; height: 58mm;
  }
  .qr svg { display: block; width: 50mm; height: 50mm; }
  .voet { margin-top: auto; height: 3mm; }
</style>
</head>
<body>
  <div class="kaart">
    <div class="merk">Tante Rie</div>
    <h1>Fijn dat je bij Tante Rie was.</h1>
    <p>Wil je vertellen hoe je het vond? Scan de code, we lezen alles met aandacht.</p>
    <div class="qr" aria-label="QR-code naar de Google-reviews van Tante Rie">
      <!-- QR-code ongewijzigd, ingeladen uit qr-review.svg; alleen geschaald -->
      <svg viewBox="0 0 490 490" xmlns="http://www.w3.org/2000/svg"><image href="qr-review.svg" width="490" height="490"/></svg>
    </div>
    <div class="voet"></div>
  </div>
</body>
</html>
